      description: |-
        Return changes after a cursor, in server order.

        The cursor is a server sequence, which is allocated at commit time, so
        paginating by it cannot skip a change that committed late.
      parameters:
      - in: query
        name: connection
        schema:
          type: string
        description: '`connection` value from `POST /sync/connections/`. Naming it
          records the cursor as this connection''s applied position.'
      - in: query
        name: cursor
        schema:
          type: integer
        description: Return changes after this sequence; defaults to 0.
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum changes per page; defaults to 100, maximum 500.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: '`cursor` or `limit` is not an integer.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorExpired'
          description: The cursor was compacted away; take a fresh snapshot.
