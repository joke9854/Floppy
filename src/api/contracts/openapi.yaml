openapi: 3.0.3
info:
  title: Floppy verified MCP, CineTrack and grounding API
  version: 1.0.0
  description: Verified consumer subset covering MCP HTTP operations, the CineTrack
    app's tracking and sync operations, public grounding information, and ListenBrainz-compatible
    authentication. The full diagnostic API schema remains available at /api/schema/.
  contact:
    url: https://github.com/dannyvfilms/Floppy/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/cinetrack/bootstrap/jobs/:
    post:
      operationId: api_v1_cinetrack_bootstrap_jobs_create
      description: Queue a bootstrap job.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; no job was created.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The job could not be queued; retry later.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/bootstrap/jobs/{job_id}/:
    get:
      operationId: api_v1_cinetrack_bootstrap_jobs_retrieve
      description: Return a bootstrap job's state.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapJob'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Unknown or expired job; resubmit the batch.
      x-required-scope: watchlist:read
  /api/v1/cinetrack/bootstrap/movies/ensure/:
    post:
      operationId: api_v1_cinetrack_bootstrap_movies_ensure_create
      description: Ensure a batch of movies exists for the user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; nothing was written.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Episode metadata could not be fetched; nothing was written.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: client_event_id already belongs to another event.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The batch could not be written; retry is safe.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Database busy; nothing was written. Retry after Retry-After
            seconds.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/bootstrap/shows/ensure/:
    post:
      operationId: api_v1_cinetrack_bootstrap_shows_ensure_create
      description: Ensure a batch of shows exists for the user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; nothing was written.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Episode metadata could not be fetched; nothing was written.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: client_event_id already belongs to another event.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The batch could not be written; retry is safe.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Database busy; nothing was written. Retry after Retry-After
            seconds.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/connection/:
    get:
      operationId: api_v1_cinetrack_connection_retrieve
      description: Return safe identity and capability information for this remote.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackConnection'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:read scope.
      x-required-scope: watchlist:read
  /api/v1/cinetrack/crash-reports/:
    get:
      operationId: api_v1_cinetrack_crash_reports_retrieve
      description: List the caller's own reports, newest received first.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Reports to return, 1-500 (default 100).
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Invalid limit.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:read scope.
      x-required-scope: watchlist:read
    post:
      operationId: api_v1_cinetrack_crash_reports_create
      description: Store a crash report once per (account, report_id).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportResult'
          description: Report id was already received; nothing changed.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportResult'
          description: Report stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Invalid report fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:write scope.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Too many crash reports.
      x-required-scope: watchlist:write
  /api/v1/discover/:
    get:
      operationId: api_v1_discover_retrieve
      description: Return the cached Discover rows for the media type.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - media_type
                - show_more
                - rows
                properties:
                  media_type:
                    type: string
                  show_more:
                    type: boolean
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/health/:
    get:
      operationId: api_v1_health_retrieve
      description: Check API health status.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
          description: ''
      x-required-scope: any
  /api/v1/history/:
    get:
      operationId: listHistory
      description: Return the user's history grouped by day, newest first.
      parameters:
      - in: query
        name: album
        schema:
          type: integer
        description: Restrict music entries to one album id.
      - in: query
        name: artist
        schema:
          type: integer
        description: Restrict music entries to one artist's album id.
      - in: query
        name: end_date
        schema:
          type: string
        description: ISO date; restricts results to entries on/before this date.
      - in: query
        name: flat
        schema:
          type: string
        description: '`1` or `true` returns a flat, per-entry list (paginated by `limit`/`offset`
          over entries) instead of day-grouped buckets.'
      - in: query
        name: genre
        schema:
          type: string
        description: Filter by genre name.
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Filter music entries by an implied (derived) genre name.
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum days (or entries, when `flat=1`); maximum 200, defaults
          to 20.
      - in: query
        name: logging_style
        schema:
          type: string
          enum:
          - repeats
          - sessions
        description: Overrides the user's saved game history logging style for this
          request.
      - in: query
        name: max_entries_per_day
        schema:
          type: integer
        description: Override the per-day entry cap (default and max 200) applied
          to day-grouped results. Ignored when `flat=1`, which paginates over individual
          entries instead of days and is never capped per day.
      - in: query
        name: media_id
        schema:
          type: string
        description: Restrict to entries for one item's media_id (requires `source`).
      - in: query
        name: media_type
        schema:
          type: array
          items:
            type: string
        description: Media type filter; repeated and comma-separated syntax are accepted.
          Alias of `types`.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based offset over days (or entries, when `flat=1`); defaults
          to 0.
      - in: query
        name: person_id
        schema:
          type: string
        description: Restrict to entries credited to a person, by provider person
          id (requires `person_source`).
      - in: query
        name: person_source
        schema:
          type: string
        description: Restrict to entries credited to a person, by provider source
          (requires `person_id`).
      - in: query
        name: podcast_show
        schema:
          type: integer
        description: Restrict podcast entries to one show id.
      - in: query
        name: season
        schema:
          type: integer
        description: Restrict episode entries to one season id.
      - in: query
        name: season_number
        schema:
          type: integer
        description: Restrict episode entries to a season number (requires `media_id`/`source`).
      - in: query
        name: source
        schema:
          type: string
        description: Restrict to entries for one item's provider source (requires
          `media_id`).
      - in: query
        name: start_date
        schema:
          type: string
        description: ISO date; restricts results to entries on/after this date.
      - in: query
        name: tv
        schema:
          type: integer
        description: Restrict episode entries to one TV show id.
      - in: query
        name: types
        schema:
          type: array
          items:
            type: string
        description: Media type filter; repeated and comma-separated syntax are accepted.
          Alias of `media_type`.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/home/:
    get:
      operationId: api_v1_home_retrieve
      description: Return home groups with serialized row items.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - groups
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/imports/{service}/:
    post:
      operationId: api_v1_imports_create
      description: Dispatch the import task for the service.
      parameters:
      - in: path
        name: service
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                properties:
                  task_id:
                    type: string
          description: ''
  /api/v1/info/:
    get:
      operationId: getPublicInfo
      description: Get application information.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
          description: ''
  /api/v1/lists/:
    get:
      operationId: api_v1_lists_retrieve
      description: Retrieve the lists for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - description
                      - image
                      - owner
                      - collaborators
                      - items_count
                      - latest_update
                      - is_public
                      - public_slug
                      - allow_recommendations
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        image:
                          type: string
                          nullable: true
                        owner:
                          type: object
                          additionalProperties: true
                        collaborators:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        items_count:
                          type: integer
                        latest_update:
                          type: string
                          format: date-time
                          nullable: true
                        is_public:
                          type: boolean
                        public_slug:
                          type: string
                          nullable: true
                        allow_recommendations:
                          type: boolean
                        items:
                          oneOf:
                          - type: array
                            items:
                              type: object
                              additionalProperties: true
                          - type: object
                            required:
                            - pagination
                            - results
                            properties:
                              pagination:
                                type: object
                                required:
                                - total
                                - limit
                                - offset
                                - next
                                - previous
                                properties:
                                  total:
                                    type: integer
                                  limit:
                                    type: integer
                                  offset:
                                    type: integer
                                  next:
                                    type: string
                                    nullable: true
                                  previous:
                                    type: string
                                    nullable: true
                              results:
                                type: array
                                items:
                                  type: object
                                  additionalProperties: true
          description: ''
    post:
      operationId: api_v1_lists_create
      description: Create a new custom list for the authenticated user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - items_count
                - latest_update
                - is_public
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  is_public:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
  /api/v1/lists/{list_id}/:
    patch:
      operationId: api_v1_lists_partial_update
      description: Update a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - items_count
                - latest_update
                - is_public
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  is_public:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
    delete:
      operationId: api_v1_lists_destroy
      description: Delete a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/lists/{list_id}/items/:
    get:
      operationId: api_v1_lists_items_retrieve
      description: Get items of a list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaEnvelope'
          description: ''
  /api/v1/media/:
    get:
      operationId: listTrackedMedia
      description: Retrieve the filtered media list for the authenticated user.
      parameters:
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
          enum:
          - all
          - collected
          - not_collected
      - in: query
        name: completed_date_from
        schema:
          type: string
        description: Match items completed on or after this date (YYYY-MM-DD), independent
          of release year.
      - in: query
        name: completed_date_to
        schema:
          type: string
        description: Match items completed on or before this date (YYYY-MM-DD).
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: exclude
        schema:
          type: array
          items:
            type: string
        description: Root-list type exclusions; repeated and comma-separated syntax
          are accepted.
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: genre
        schema:
