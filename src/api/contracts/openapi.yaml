components:
  schemas:
    AppConnection:
      type: object
      description: A registered app connection and where its cursor should start.
      properties:
        connection:
          type: string
          description: Pass as `connection` when pulling the change feeds.
        client:
          type: string
        instance_key:
          type: string
        oldest_sequence:
          type: integer
          nullable: true
        newest_sequence:
          type: integer
          description: Start the cursor here after taking a full snapshot.
      required:
      - client
      - connection
      - instance_key
      - newest_sequence
      - oldest_sequence
    AppConnectionRequest:
      type: object
      description: Body for registering an app as a pull client.
      properties:
        client:
          type: string
          description: Short client slug, for example `cinetrack`.
          pattern: ^[a-z0-9_-]{1,32}$
        instance_key:
          type: string
          description: Stable per-install identifier, chosen by the client.
          maxLength: 128
          minLength: 1
        label:
          type: string
          description: Display name; defaults to the client slug.
          maxLength: 255
      required:
      - client
      - instance_key
    BootstrapJobKindEnum:
      enum:
      - movies
      - shows
      type: string
      description: |-
        * `movies` - movies
        * `shows` - shows
    ChangeFeedResponse:
      type: object
      description: A page of an ordered change feed.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WatchedStateChange'
        next_cursor:
          type: integer
          description: Pass as `cursor` to fetch the next page.
        has_more:
          type: boolean
        oldest_sequence:
          type: integer
          nullable: true
        newest_sequence:
          type: integer
          nullable: true
      required:
      - has_more
      - newest_sequence
      - next_cursor
      - oldest_sequence
      - results
    CineTrackApiExtensions:
      type: object
      description: Fork capabilities; clients must discover these, never infer them.
      properties:
        cinetrack_episode_events_v1:
          type: boolean
        cinetrack_bootstrap_v2:
          type: boolean
        cinetrack_bootstrap_jobs_v1:
          type: boolean
        episode_sql_pagination:
          type: boolean
        cinetrack_crash_reports_v1:
          type: boolean
        cinetrack_episode_translate_v1:
          type: boolean
        cinetrack_characters_v1:
          type: boolean
      required:
      - cinetrack_bootstrap_jobs_v1
      - cinetrack_bootstrap_v2
      - cinetrack_characters_v1
      - cinetrack_crash_reports_v1
      - cinetrack_episode_events_v1
      - cinetrack_episode_translate_v1
      - episode_sql_pagination
    CineTrackBootstrapJob:
      type: object
      description: A job's state. ``results`` is present once ``status`` is ``done``.
      properties:
        job_id:
          type: string
        kind:
          $ref: '#/components/schemas/BootstrapJobKindEnum'
        status:
          $ref: '#/components/schemas/CineTrackBootstrapJobStatusEnum'
        total:
          type: integer
        processed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackBootstrapJobResult'
      required:
      - job_id
      - kind
      - processed
      - status
      - total
    CineTrackBootstrapJobRequest:
      type: object
      description: Exactly one of ``movies`` or ``shows``.
      properties:
        movies:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackMovieInput'
        shows:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackShowInput'
    CineTrackBootstrapJobResult:
      type: object
      description: A job result; ``error`` means this entry's outcome is unknown,
        resubmit it.
      properties:
        source:
          type: string
        media_id:
          type: string
        client_event_id:
          type: string
        season_number:
          type: integer
        episode_number:
          type: integer
        stored_season_number:
          type: integer
        stored_episode_number:
          type: integer
        status:
          $ref: '#/components/schemas/CineTrackBootstrapJobResultStatusEnum'
        reason:
          type: string
        title:
          type: string
      required:
      - status
    CineTrackBootstrapJobResultStatusEnum:
      enum:
      - created
      - already_satisfied
      - error
      type: string
      description: |-
        * `created` - created
        * `already_satisfied` - already_satisfied
        * `error` - error
    CineTrackBootstrapJobStatusEnum:
      enum:
      - queued
      - running
      - done
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `done` - done
    CineTrackBootstrapResponse:
      type: object
      description: The outcomes for a batch of ensured items.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackBootstrapResult'
      required:
      - results
    CineTrackBootstrapResult:
      type: object
      description: The outcome for one ensured item.
      properties:
        source:
          type: string
        media_id:
          type: string
        client_event_id:
          type: string
        season_number:
          type: integer
        episode_number:
          type: integer
        stored_season_number:
          type: integer
        stored_episode_number:
          type: integer
        status:
          $ref: '#/components/schemas/CineTrackBootstrapResultStatusEnum'
        reason:
          type: string
        title:
          type: string
      required:
      - status
    CineTrackBootstrapResultStatusEnum:
      enum:
      - created
      - already_satisfied
      - not_found
      - metadata_unavailable
      type: string
      description: |-
        * `created` - created
        * `already_satisfied` - already_satisfied
        * `not_found` - not_found
        * `metadata_unavailable` - metadata_unavailable
    CineTrackCharacter:
      type: object
      description: One on-screen character with its TVDB pictures.
      properties:
        name:
          type: string
        person_name:
          type: string
        person_id:
          type: string
        character_image:
          type: string
          nullable: true
        person_image:
          type: string
          nullable: true
        sort:
          type: integer
          nullable: true
      required:
      - character_image
      - name
      - person_id
      - person_image
      - person_name
      - sort
    CineTrackCharactersResponse:
      type: object
