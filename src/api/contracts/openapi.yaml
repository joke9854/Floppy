  /api/v1/scrobble/:
    post:
      operationId: api_v1_scrobble_create
      description: Record a playback start/pause/stop event from a third-party client.
        Movies are identified by tmdb/imdb id; episodes additionally require season_number/episode_number.
        Anime clients may add an anidb id to pin the exact MyAnimeList cour. 'start'
        only updates the live Now Playing card; 'pause' also saves the resume position;
        'stop' persists a durable watch/progress update. A stop counts as watched
        once progress reaches the user's threshold (scrobble_watched_percent in /user/preferences/,
        80% by default); below it, only the resume position is kept. Rewatches are
        recorded as new plays; the same play sent twice is reported as a duplicate.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - media_type
              - ids
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - pause
                  - stop
                media_type:
                  type: string
                  enum:
                  - movie
                  - episode
                ids:
                  type: object
                  description: At least one of tmdb/imdb/tvdb is required.
                  properties:
                    tmdb:
                      type: string
                      nullable: true
                    imdb:
                      type: string
                      nullable: true
                    tvdb:
                      type: string
                      nullable: true
                    anidb:
                      type: string
                      nullable: true
                      description: 'Optional, and never sufficient on its own. When
                        the user''s Anime library stores flat MyAnimeList rows, this
                        names the exact cour instead of inferring one from the season
                        and episode numbers. It selects the entry, not the library
                        shape: that follows the user''s Anime Provider and stays with
                        the show once it is tracked.'
                title:
                  type: string
                  nullable: true
                series_title:
                  type: string
                  nullable: true
                  description: Required (in effect) for media_type 'episode' to power
                    live-card display and title search fallback.
                season_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                episode_number:
                  type: integer
                  nullable: true
                  description: Required for media_type 'episode'.
                position_seconds:
                  type: integer
                  nullable: true
                duration_seconds:
                  type: integer
                  nullable: true
                progress:
                  type: number
                  minimum: 0
                  maximum: 100
                  nullable: true
                  description: Percent watched. Optional; derived from position_seconds/duration_seconds
                    when omitted.
                completed:
                  type: boolean
                  nullable: true
                  description: Only used by 'stop'. Overrides the watched threshold
                    when given.
                played_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Only used by 'stop'. Defaults to the exact time the
                    server receives the event.
                score:
                  type: number
                  nullable: true
                  description: Only used by 'stop', for media_type 'episode'. Sets
                    the user's rating (0-10) on the episode.
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  action:
                    type: string
                    enum:
                    - start
                    - pause
                    - scrobble
                    description: '''scrobble'' when a stop counted as watched; ''pause''
                      for a pause or a stop below the threshold.'
                  progress:
                    type: number
                    nullable: true
                  watched:
                    type: boolean
                  duplicate:
                    type: boolean
                    nullable: true
                    description: 'For a watched movie or episode: true when the play
                      matched one already stored and nothing new was recorded. Null
                      when not applicable.'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  errors:
                    type: string
          description: ''
      x-required-scope: scrobble:write
