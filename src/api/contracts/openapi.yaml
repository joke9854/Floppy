      description: The full sync state of the library, ordered by Floppy's item id.
        Start without 'after', then pass 'next_after' until it is null. Keep 'cursor'
        from the first page and then follow /sync/items/changes/ from it, so nothing
        that changes while paging is missed. Needs an active app sync connection (POST
        /sync/connections/) for the changes feed to be kept.
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: Item id to continue after.
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-500, default 200.
