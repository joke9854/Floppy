    UserSidebarUpdateResponse:
      type: object
      description: User fields changed by a sidebar update.
      properties:
        updated_fields:
          type: array
          items:
            type: string
      required:
      - updated_fields
    WatchedStateChange:
      type: object
      description: One entry in the watched-state change feed.
      properties:
        sequence:
          type: integer
        revision:
          type: integer
        previous_revision:
          type: integer
          nullable: true
        kind:
          type: string
        watched:
          type: boolean
          nullable: true
        play_count:
          type: integer
          nullable: true
        watched_at:
          type: string
          format: date-time
          nullable: true
        media_id:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        media_type:
          type: string
          nullable: true
        season_number:
          type: integer
          nullable: true
          description: Null for anything that is not an episode.
        episode_number:
          type: integer
          nullable: true
        origin_kind:
          type: string
        correlation_id:
          type: string
      required:
      - correlation_id
      - episode_number
      - kind
      - media_id
      - media_type
      - origin_kind
      - play_count
      - previous_revision
      - revision
      - season_number
      - sequence
      - source
      - watched
      - watched_at
    WatchedStateProvenance:
      type: object
      description: Who last changed a watched state, and when.
      properties:
        origin_kind:
          type: string
          description: Explicit and inferred changes stay distinguishable.
        origin_key:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
      - origin_key
      - origin_kind
      - updated_at
    WatchedStateRequest:
      type: object
      description: Body for asserting a watched state.
      properties:
        watched:
          type: boolean
          description: Must be a JSON boolean.
        watched_at:
          type: string
          format: date-time
          nullable: true
          description: Exact ISO-8601 instant of the watch; only read when `watched`
            is true. Defaults to the server's current time and may not be in the future.
        play_count:
          type: integer
          nullable: true
        client_event_id:
          type: string
          description: Idempotency key; the `Idempotency-Key` header takes precedence.
      required:
      - watched
    WatchedStateResponse:
      type: object
      description: Canonical watched state of one item.
      properties:
        media_id:
          type: string
        source:
          type: string
        media_type:
          type: string
        watched:
          type: boolean
        play_count:
          type: integer
        first_watched_at:
          type: string
          format: date-time
          nullable: true
        last_watched_at:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          description: Monotonic per-item revision; usable as `If-Match` on PUT.
        conflicted:
          type: boolean
        provenance:
          allOf:
          - $ref: '#/components/schemas/WatchedStateProvenance'
          nullable: true
          description: Null when the item has never had a recorded state.
      required:
      - conflicted
      - first_watched_at
      - last_watched_at
      - media_id
      - media_type
      - play_count
      - provenance
      - revision
      - source
      - watched
    WatchedStateRevisionConflict:
      type: object
      description: Body of a 409 when `If-Match` does not match the current revision.
      properties:
        detail:
          type: string
        revision:
          type: integer
          description: The current revision.
      required:
      - detail
      - revision
    WatchedStateWriteResponse:
      type: object
      description: Watched state after an explicit assertion.
      properties:
        media_id:
          type: string
        source:
          type: string
        media_type:
          type: string
        watched:
          type: boolean
        play_count:
          type: integer
        first_watched_at:
          type: string
          format: date-time
          nullable: true
        last_watched_at:
          type: string
          format: date-time
          nullable: true
        revision:
          type: integer
          description: Monotonic per-item revision; usable as `If-Match` on PUT.
        conflicted:
          type: boolean
        provenance:
          allOf:
          - $ref: '#/components/schemas/WatchedStateProvenance'
          nullable: true
          description: Null when the item has never had a recorded state.
        replayed:
          type: boolean
          description: True when the idempotency key matched an earlier change.
        unchanged:
          type: boolean
          description: True when the assertion matched the existing state.
      required:
      - conflicted
      - first_watched_at
      - last_watched_at
      - media_id
      - media_type
      - play_count
      - provenance
      - replayed
      - revision
      - source
      - unchanged
      - watched
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
    listenBrainzToken:
      type: apiKey
      in: header
      name: Authorization
      description: ListenBrainz token in the form `Token <token>`.
