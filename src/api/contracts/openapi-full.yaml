    put:
      operationId: api_v1_media_watched_state_update
      description: |-
        Set watched state explicitly.

        This is a state assertion, not a play. It records no playback session
        and removes no history, which is what keeps "mark unwatched" distinct
        from "delete history".
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Replays with the same key return the first result.
      - in: header
        name: If-Match
        schema:
          type: integer
        description: Expected current revision; a mismatch answers 409.
      - in: query
        name: episode_number
        schema:
          type: integer
        description: Episode number of the addressed episode.
      - in: query
        name: library_media_type
        schema:
          type: string
        description: Disambiguates an item that exists in several library buckets.
      - in: path
        name: media_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: query
        name: season_number
        schema:
          type: integer
        description: Season of the addressed episode.
      - in: path
        name: source
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchedStateRequest'
