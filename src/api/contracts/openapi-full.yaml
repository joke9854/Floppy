components:
  schemas:
    ActionEnum:
      enum:
      - add
      - remove
      type: string
      description: |-
        * `add` - add
        * `remove` - remove
    ActivityData:
      type: object
      description: Activity calendar (``app.stats_activity.get_activity_data``).
      properties:
        calendar_weeks:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/ActivityDay'
        months:
          type: array
          items:
            type: array
            items: {}
          description: '`[month label, week count]` pairs; the label is empty for
            months spanning a single week.'
        weekday_labels:
          type: array
          items:
            type: string
        stats:
          $ref: '#/components/schemas/ActivityStats'
      required:
      - calendar_weeks
      - months
      - stats
      - weekday_labels
    ActivityDay:
      type: object
      description: One day cell of the activity calendar.
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
        level:
          type: integer
          description: Heat level, 0 to 4.
      required:
      - count
      - date
      - level
    ActivityStats:
      type: object
      description: Activity calendar summary.
      properties:
        most_active_day:
          type: string
          nullable: true
        most_active_day_percentage:
          type: integer
        current_streak:
          type: integer
        longest_streak:
          type: integer
        longest_streak_start:
          type: string
          format: date
          nullable: true
        longest_streak_end:
          type: string
          format: date
          nullable: true
      required:
      - current_streak
      - longest_streak
      - longest_streak_end
      - longest_streak_start
      - most_active_day
      - most_active_day_percentage
    AlbumResyncResult:
      type: object
      description: The album holding the plays after a resync.
      properties:
        album_id:
          type: integer
          description: The album now holding the plays. Differs from the requested
            id when that album was a duplicate and was merged into this one.
        merged:
          type: boolean
        track_count:
          type: integer
          nullable: true
          description: Tracks in the refreshed tracklist; null after a merge.
      required:
      - album_id
      - merged
      - track_count
    AnimeMigrationRequest:
      type: object
      description: Which provider's grouped series to migrate into.
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
      required:
      - provider
    AppConnection:
      type: object
      description: A registered app connection and where its cursor should start.
      properties:
        connection:
          type: string
          description: Pass as `connection` when pulling the change feeds.
        client:
          type: string
        instance_key:
          type: string
        oldest_sequence:
          type: integer
          nullable: true
        newest_sequence:
          type: integer
          description: Start the cursor here after taking a full snapshot.
      required:
      - client
      - connection
      - instance_key
      - newest_sequence
      - oldest_sequence
    AppConnectionRequest:
      type: object
      description: Body for registering an app as a pull client.
      properties:
        client:
          type: string
          description: Short client slug, for example `cinetrack`.
          pattern: ^[a-z0-9_-]{1,32}$
        instance_key:
          type: string
          description: Stable per-install identifier, chosen by the client.
          maxLength: 128
          minLength: 1
        label:
          type: string
          description: Display name; defaults to the client slug.
          maxLength: 255
      required:
      - client
      - instance_key
    BlankEnum:
      enum:
      - ''
    BootstrapJobKindEnum:
      enum:
      - movies
      - shows
      type: string
      description: |-
        * `movies` - movies
        * `shows` - shows
    CalendarEnvelope:
      type: object
      description: Paginated calendar events.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      required:
      - pagination
      - results
    ChangeFeedResponse:
      type: object
      description: A page of an ordered change feed.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WatchedStateChange'
        next_cursor:
          type: integer
          description: Pass as `cursor` to fetch the next page.
        has_more:
          type: boolean
        oldest_sequence:
          type: integer
          nullable: true
        newest_sequence:
          type: integer
          nullable: true
      required:
      - has_more
      - newest_sequence
      - next_cursor
      - oldest_sequence
      - results
    ChangesHistoryChange:
      type: object
      description: One changed field in a history record.
      properties:
        field:
          type: string
        old_value:
          nullable: true
        new_value:
          nullable: true
      required:
      - field
      - new_value
      - old_value
    ChangesHistoryEntryResponse:
      type: object
      description: Exact ChangesHistoryEntrySerializer representation.
      properties:
        id:
          type: integer
          nullable: true
        item_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangesHistoryChange'
      required:
      - changes
      - id
      - item_id
      - timestamp
    ChangesHistoryEnvelope:
      type: object
      description: Paginated changes history.
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChangesHistoryEntryResponse'
      required:
      - pagination
      - results
    CineTrackApiExtensions:
      type: object
      description: Fork capabilities; clients must discover these, never infer them.
      properties:
        cinetrack_episode_events_v1:
          type: boolean
        cinetrack_bootstrap_v2:
          type: boolean
        cinetrack_bootstrap_jobs_v1:
          type: boolean
        episode_sql_pagination:
          type: boolean
        cinetrack_crash_reports_v1:
          type: boolean
        cinetrack_episode_translate_v1:
          type: boolean
        cinetrack_characters_v1:
          type: boolean
      required:
      - cinetrack_bootstrap_jobs_v1
      - cinetrack_bootstrap_v2
      - cinetrack_characters_v1
      - cinetrack_crash_reports_v1
      - cinetrack_episode_events_v1
      - cinetrack_episode_translate_v1
      - episode_sql_pagination
    CineTrackBootstrapJob:
      type: object
      description: A job's state. ``results`` is present once ``status`` is ``done``.
      properties:
        job_id:
          type: string
        kind:
          $ref: '#/components/schemas/BootstrapJobKindEnum'
        status:
          $ref: '#/components/schemas/CineTrackBootstrapJobStatusEnum'
        total:
          type: integer
        processed:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackBootstrapJobResult'
      required:
      - job_id
      - kind
      - processed
      - status
      - total
    CineTrackBootstrapJobRequest:
      type: object
      description: Exactly one of ``movies`` or ``shows``.
      properties:
        movies:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackMovieInput'
        shows:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackShowInput'
    CineTrackBootstrapJobResult:
      type: object
      description: A job result; ``error`` means this entry's outcome is unknown,
        resubmit it.
      properties:
        source:
          type: string
        media_id:
          type: string
        client_event_id:
          type: string
        season_number:
          type: integer
        episode_number:
          type: integer
        stored_season_number:
          type: integer
        stored_episode_number:
          type: integer
        status:
          $ref: '#/components/schemas/CineTrackBootstrapJobResultStatusEnum'
        reason:
          type: string
        title:
          type: string
      required:
      - status
    CineTrackBootstrapJobResultStatusEnum:
      enum:
      - created
      - already_satisfied
      - error
      type: string
      description: |-
        * `created` - created
        * `already_satisfied` - already_satisfied
        * `error` - error
    CineTrackBootstrapJobStatusEnum:
      enum:
      - queued
      - running
      - done
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `done` - done
    CineTrackBootstrapResponse:
      type: object
      description: The outcomes for a batch of ensured items.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CineTrackBootstrapResult'
      required:
      - results
    CineTrackBootstrapResult:
      type: object
      description: The outcome for one ensured item.
      properties:
        source:
          type: string
        media_id:
          type: string
        client_event_id:
          type: string
        season_number:
          type: integer
        episode_number:
          type: integer
        stored_season_number:
          type: integer
        stored_episode_number:
          type: integer
        status:
          $ref: '#/components/schemas/CineTrackBootstrapResultStatusEnum'
        reason:
          type: string
        title:
          type: string
      required:
      - status
    CineTrackBootstrapResultStatusEnum:
      enum:
      - created
      - already_satisfied
      - not_found
      - metadata_unavailable
      type: string
      description: |-
        * `created` - created
        * `already_satisfied` - already_satisfied
        * `not_found` - not_found
        * `metadata_unavailable` - metadata_unavailable
    CineTrackCharacter:
