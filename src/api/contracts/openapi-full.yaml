      operationId: listTrackedMedia
      description: Retrieve the filtered media list for the authenticated user.
      parameters:
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
          enum:
          - all
          - collected
          - not_collected
      - in: query
        name: completed_date_from
        schema:
          type: string
        description: Match items completed on or after this date (YYYY-MM-DD), independent
          of release year.
      - in: query
        name: completed_date_to
        schema:
          type: string
        description: Match items completed on or before this date (YYYY-MM-DD).
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: exclude
        schema:
          type: array
          items:
            type: string
        description: Root-list type exclusions; repeated and comma-separated syntax
          are accepted.
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: genre
        schema:
          type: string
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Music-only implied genre filter.
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum 200; defaults to 20.
      - in: query
        name: media_status
        schema:
          type: string
        description: Provider metadata status, not the user's tracking status.
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Optional type restriction; omitted returns the default media
          types.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset; defaults to 0.
      - in: query
        name: origin
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple platforms; comma-separated values are also
          accepted.
      - in: query
        name: platform_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: progress
        schema:
          type: string
          enum:
          - all
          - caught_up
          - not_caught_up
        description: Currently meaningful for TV and anime lists.
      - in: query
        name: provider
        schema:
          type: string
      - in: query
        name: rating
        schema:
          type: string
          enum:
          - all
          - not_rated
          - rated
      - in: query
        name: release
        schema:
          type: string
          enum:
          - all
          - not_released
          - released
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - added
          - author
          - critic_rating
          - date_added
          - end_date
          - ended
          - id
          - itemid
          - mediaid
          - next_episode_air_date
          - platform
          - plays
          - popularity
          - progress
          - release_date
          - runtime
          - score
          - source
          - start_date
          - started
          - time_left
          - time_to_beat
          - time_watched
          - title
          - type
          - updated
        description: Legacy `field_asc`/`field_desc` suffixes remain accepted.
      - in: query
