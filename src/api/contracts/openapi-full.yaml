openapi: 3.0.3
info:
  title: Floppy
  version: 1.0.0
  description: A self-hosted media tracker.
  contact:
    url: https://github.com/dannyvfilms/Floppy/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/calendar/:
    get:
      operationId: api_v1_calendar_retrieve
      description: Retrieve calendar events for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: catalog:read
  /api/v1/calendar/update/:
    post:
      operationId: api_v1_calendar_update_create
      description: Trigger calendar events update for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: catalog:write
  /api/v1/changes_history/{media_type}/{history_id}/:
    get:
      operationId: api_v1_changes_history_retrieve
      description: Retrieve the changes history record for a specific media.
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesHistoryEntryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:read
    delete:
      operationId: api_v1_changes_history_destroy
      description: Delete the changes history record for a specific media.
      parameters:
      - in: path
        name: history_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/bootstrap/jobs/:
    post:
      operationId: api_v1_cinetrack_bootstrap_jobs_create
      description: Queue a bootstrap job.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackBootstrapJobRequest'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; no job was created.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The job could not be queued; retry later.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/bootstrap/jobs/{job_id}/:
    get:
      operationId: api_v1_cinetrack_bootstrap_jobs_retrieve
      description: Return a bootstrap job's state.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapJob'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Unknown or expired job; resubmit the batch.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:read
  /api/v1/cinetrack/bootstrap/movies/ensure/:
    post:
      operationId: api_v1_cinetrack_bootstrap_movies_ensure_create
      description: Ensure a batch of movies exists for the user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackMoviesEnsureRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; nothing was written.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: client_event_id already belongs to another event.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The batch could not be written; retry is safe.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Database busy, or the metadata provider is unavailable (code
            provider_unavailable); nothing was written. Retry after Retry-After seconds.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/bootstrap/shows/ensure/:
    post:
      operationId: api_v1_cinetrack_bootstrap_shows_ensure_create
      description: Ensure a batch of shows exists for the user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackShowsEnsureRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackBootstrapResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Malformed or oversized batch; nothing was written.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: client_event_id already belongs to another event.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The batch could not be written; retry is safe.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Database busy, or the metadata provider is unavailable (code
            provider_unavailable); nothing was written. Retry after Retry-After seconds.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/cinetrack/connection/:
    get:
      operationId: api_v1_cinetrack_connection_retrieve
      description: Return safe identity and capability information for this remote.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackConnection'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:read scope.
      x-required-scope: watchlist:read
  /api/v1/cinetrack/crash-reports/:
    get:
      operationId: api_v1_cinetrack_crash_reports_retrieve
      description: List the caller's own reports, newest received first.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Reports to return, 1-500 (default 100).
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Invalid limit.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:read scope.
      x-required-scope: watchlist:read
    post:
      operationId: api_v1_cinetrack_crash_reports_create
      description: Store a crash report once per (account, report_id).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CineTrackCrashReport'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportResult'
          description: Report id was already received; nothing changed.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CineTrackCrashReportResult'
          description: Report stored.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Invalid report fields.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Token lacks the watchlist:write scope.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Too many crash reports.
      x-required-scope: watchlist:write
  /api/v1/collection/:
    get:
      operationId: api_v1_collection_retrieve
      description: List the user's collection entries.
      parameters:
      - in: query
        name: item_media_type
        schema:
          type: string
        description: Only entries whose item has this media type.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based offset.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Invalid pagination parameter.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:read
    post:
      operationId: api_v1_collection_create
      description: Add an item to the collection (mirrors collection_add).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionEntryCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionEntryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionEntryCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEntryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFormError'
          description: '`item_id` missing (body has only `detail`) or invalid collection
            data (body also has `errors`).'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Item not found.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/collection/{entry_id}/:
    get:
      operationId: retrieveCollectionEntry
      description: Return a single collection entry.
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEntryResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Collection entry not found.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:read
    patch:
      operationId: api_v1_collection_partial_update
      description: Update collection entry metadata (mirrors collection_update).
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCollectionEntryUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCollectionEntryUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCollectionEntryUpdateRequest'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionEntryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFormError'
          description: Invalid collection data.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Collection entry not found.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
    delete:
      operationId: api_v1_collection_destroy
      description: Remove an entry from the collection (mirrors collection_remove).
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Collection entry not found.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/collection/bulk/:
    post:
      operationId: bulkAddToCollection
      description: Create the missing collection entries.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionBulkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionBulkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionBulkRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionBulkResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:write
  /api/v1/collection/fields/:
    get:
      operationId: getCollectionFields
      description: Return the groups and fields, in display order.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFieldSchema'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: The token does not hold the scope this operation requires.
      x-required-scope: watchlist:read
    put:
      operationId: saveCollectionFields
      description: Replace the whole schema. Groups and fields with an id are updated,
        those without one are created, and the user's groups and fields missing from
        the payload are deleted (limited to `known_field_ids` when it is sent).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionFieldSchemaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectionFieldSchemaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectionFieldSchemaRequest'
        required: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionFieldSchema'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: Credentials are missing, invalid, or expired.
        '403':
          content:
            application/json:
