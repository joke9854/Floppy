      <stop offset="0" stop-color="#2c2b35"/>
      <stop offset="1" stop-color="#1c1b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
