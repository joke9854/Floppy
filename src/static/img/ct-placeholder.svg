<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Floppy's missing-artwork placeholder: the app's dark surface with a faint
       accent glow and a centred film mark. Square, so object-fit: cover keeps
       the mark centred on posters (2:3), stills (16:9) and portraits alike. -->
  <defs>
