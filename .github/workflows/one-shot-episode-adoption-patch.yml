name: One-shot episode adoption patch

on:
  push:
    branches:
      - CineTrack-API

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-local-episode-adoption]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact local-only adoption patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/api/cinetrack_bootstrap_views.py')
          text = path.read_text()
          old = '''                            if legacy.watch_operation_id is None:\n                                legacy.watch_operation_id = client_event_id\n                                legacy.save(update_fields=["watch_operation_id"])\n'''
          new = '''                            if legacy.watch_operation_id is None:\n                                # This is identity adoption for an already-existing\n                                # exact timestamp event. Keep it local: Episode.save()\n                                # performs provider-backed completion reconciliation,\n                                # which would turn one batch fetch into an N+1 path.\n                                updated = Episode.objects.filter(\n                                    pk=legacy.pk,\n                                    watch_operation_id__isnull=True,\n                                ).update(watch_operation_id=client_event_id)\n                                if updated:\n                                    legacy.watch_operation_id = client_event_id\n                                else:\n                                    claimed = Episode.objects.filter(pk=legacy.pk).only("watch_operation_id").first()\n                                    if claimed is None or claimed.watch_operation_id != client_event_id:\n                                        return Response(\n                                            {"detail": "client_event_id conflicts with an existing episode event."},\n                                            status=HTTP.CONFLICT,\n                                        )\n'''
          if old not in text:
              raise SystemExit('expected legacy adoption block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/cinetrack_bootstrap_views.py
          git commit -m "Make legacy episode adoption provider-free"
          git push
