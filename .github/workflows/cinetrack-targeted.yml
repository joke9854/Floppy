name: CineTrack API Targeted Tests

on:
  push:
    branches:
      - CineTrack-API
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Configure test secret
        run: echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Connection and scoped-token tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_connection --exclude-tag network

      - name: Bootstrap performance tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_bootstrap_performance --exclude-tag network

      - name: Existing-data bootstrap tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_existing_data --exclude-tag network

      - name: Bootstrap job and error reporting tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_bootstrap_jobs config.tests.test_error_reporting --exclude-tag network

      - name: Scope map coverage
        run: uv run --no-sync python src/manage.py test api.tests.test_fork_scope_enforcement.ScopeMapCoverageTests --exclude-tag network

      - name: OpenAPI coverage and committed contract
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_openapi app.tests.test_api_contracts --exclude-tag network

      - name: Duplicate-play report and cleanup
        run: uv run --no-sync python src/manage.py test app.tests.test_report_cinetrack_duplicate_plays app.tests.test_dedupe_cinetrack_movie_plays --exclude-tag network

      - name: Misplaced absolute-numbered episode repair
        run: uv run --no-sync python src/manage.py test api.tests.test_repair_cinetrack_absolute_episode_plays --exclude-tag network

      - name: Tracking, sync and scrobble endpoints
        run: uv run --no-sync python src/manage.py test api.tests.test_fork_tracking api.tests.test_sync_writes api.tests.test_sync_items api.tests.test_fork_scrobble --exclude-tag network

      - name: Episode translate, characters and crash reports
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_episode_translate api.tests.test_cinetrack_characters api.tests.test_cinetrack_crash_reports --exclude-tag network

      - name: OAuth app sign-in
        run: uv run --no-sync python src/manage.py test api.tests.test_oauth_app_signin --exclude-tag network

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install MCP server and its test dependencies
        run: uv sync --locked --no-default-groups --package floppy-mcp --extra dev

      - name: MCP server tests
        run: uv run --no-sync pytest mcp_server/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff
        run: uv run --no-sync ruff check src
