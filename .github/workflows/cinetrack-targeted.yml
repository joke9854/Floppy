name: CineTrack API Targeted Tests

on:
  push:
    branches:
      - CineTrack-API
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Configure test secret
        run: echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Connection and scoped-token tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_connection --exclude-tag network

      - name: Bootstrap performance tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_bootstrap_performance --exclude-tag network

      - name: Existing-data bootstrap tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_existing_data --exclude-tag network

      - name: Bootstrap job and error reporting tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_bootstrap_jobs config.tests.test_error_reporting --exclude-tag network

      - name: Scope map coverage
        run: uv run --no-sync python src/manage.py test api.tests.test_fork_scope_enforcement.ScopeMapCoverageTests --exclude-tag network

      - name: OpenAPI coverage and committed contract
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_openapi app.tests.test_api_contracts --exclude-tag network

      - name: Duplicate-play report and cleanup
        run: uv run --no-sync python src/manage.py test app.tests.test_report_cinetrack_duplicate_plays app.tests.test_dedupe_cinetrack_movie_plays --exclude-tag network

      - name: Misplaced absolute-numbered episode repair
        run: uv run --no-sync python src/manage.py test api.tests.test_repair_cinetrack_absolute_episode_plays --exclude-tag network

      - name: Tracking, sync and scrobble endpoints
        run: uv run --no-sync python src/manage.py test api.tests.test_fork_tracking api.tests.test_sync_writes api.tests.test_sync_items api.tests.test_fork_scrobble --exclude-tag network

      - name: Episode translate, characters and crash reports
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_episode_translate api.tests.test_cinetrack_characters api.tests.test_cinetrack_crash_reports --exclude-tag network

      - name: OAuth app sign-in
        run: uv run --no-sync python src/manage.py test api.tests.test_oauth_app_signin --exclude-tag network

      - name: ASGI web process, gunicorn config and installer
        run: uv run --no-sync python src/manage.py test config.tests.test_asgi config.tests.test_gunicorn config.tests.test_gunicorn_worker_memory app.tests.test_installer --exclude-tag network

      - name: Session bridge (v2 P3-B) and continue watching
        run: uv run --no-sync python src/manage.py test api.tests.test_session_bridge api.tests.test_fork_continue_watching --exclude-tag network

      - name: Image cache card sizes and credit text
        run: uv run --no-sync python src/manage.py test app.tests.test_image_cache app.tests.test_templatetags app.tests.test_fanart app.tests.test_credits --exclude-tag network

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (svelte-check)
        run: npm run check

      - name: Install Chromium for component and e2e tests
        run: npx playwright install --with-deps chromium

      - name: Unit and component tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

  sqlite-postgres-copy:
    # v2 P2-A: copy a real SQLite install into Postgres and check every row.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: floppy
          POSTGRES_USER: floppy
          POSTGRES_PASSWORD: floppy-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U floppy" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: floppy
      DB_USER: floppy
      DB_PASSWORD: floppy-ci
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Configure test secret
        run: echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Beta Postgres override combines with the beta stack
        run: |
          dir=$(mktemp -d)
          cp deploy/stable-beta/docker-compose.beta.yml "$dir/docker-compose.yml"
          cp deploy/stable-beta/docker-compose.beta-postgres.yml "$dir/docker-compose.override.yml"
          : >"$dir/floppy.env"
          printf 'BETA_DB_PASSWORD=ci-only\n' >"$dir/.env"
          docker compose --project-directory "$dir" -f "$dir/docker-compose.yml" \
            -f "$dir/docker-compose.override.yml" config --format json >"$dir/merged.json"
          jq -e '.services["floppy-beta"].depends_on | has("floppy-beta-db") and has("floppy-beta-redis")' "$dir/merged.json"
          jq -e '.services["floppy-beta"].environment.DB_HOST == "floppy-beta-db"' "$dir/merged.json"
          jq -e '.services["floppy-beta"].environment.FLOPPY_BETA_MODE == "true"' "$dir/merged.json"

      - name: SQLite to Postgres copy and pg_dump snapshot
        working-directory: src
        run: uv run --no-sync python manage.py test config.tests.test_sqlite_to_postgres config.tests.test_postgres_snapshot app.tests.test_tasks_db_backup --exclude-tag network -v 2

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install MCP server and its test dependencies
        run: uv sync --locked --no-default-groups --package floppy-mcp --extra dev

      - name: MCP server tests
        run: uv run --no-sync pytest mcp_server/tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff
        run: uv run --no-sync ruff check src
