name: CineTrack API Targeted Tests

on:
  push:
    branches:
      - CineTrack-API
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Configure test secret
        run: echo "SECRET=$(uv run --no-sync python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Connection and scoped-token tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_connection --exclude-tag network

      - name: Bootstrap performance tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_bootstrap_performance --exclude-tag network

      - name: Existing-data bootstrap tests
        run: uv run --no-sync python src/manage.py test api.tests.test_cinetrack_existing_data --exclude-tag network

      - name: Scope map coverage
        run: uv run --no-sync python src/manage.py test api.tests.test_fork_scope_enforcement.ScopeMapCoverageTests --exclude-tag network
