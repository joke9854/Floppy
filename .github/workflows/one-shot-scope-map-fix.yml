name: One-shot scope map fix
on:
  push:
    branches: [CineTrack-API]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-scope-map-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add legacy ensure scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/api/scopes.py')
          s = p.read_text()
          marker = '    "api.fork_views_tracking.MediaMovieWatchView": {"POST": _W, "DELETE": _W},\n'
          addition = marker + '    "api.fork_views_tracking.MediaEpisodeEnsureView": {"POST": _W},\n'
          if '"api.fork_views_tracking.MediaEpisodeEnsureView"' not in s:
              if marker not in s:
                  raise SystemExit('scope insertion marker not found')
              s = s.replace(marker, addition, 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/api/scopes.py
          git commit -m "Map legacy episode ensure scope"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/one-shot-scope-map-fix.yml
          git commit -m "Remove temporary scope map workflow"
          git push
