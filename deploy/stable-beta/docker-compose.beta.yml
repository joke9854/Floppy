# Floppy beta: a second Floppy that runs on a COPY of the stable data.
#
# beta-setup.sh copies this file to ~/floppy/beta/docker-compose.yml, next to
# a .env (image tag, port) and a floppy.env (Floppy's own settings, copied
# from stable with the beta address). Day to day, from ~/floppy/beta:
#   docker compose ps
#   docker compose logs -f floppy-beta
#
# It has its own data folder and its own Redis, and FLOPPY_BETA_MODE=true
# pauses everything that would contact your connected services (pushes,
# tracker imports, notifications, token refreshes). See docs/stable-beta.md.
name: floppy-beta

services:
  floppy-beta:
    container_name: floppy-beta
    # beta-update.sh pins FLOPPY_BETA_TAG to the newest CineTrack-API build
    # whose CI is green (sha-<short>).
    image: ghcr.io/joke9854/floppy:${FLOPPY_BETA_TAG:-beta}
    restart: unless-stopped
    depends_on:
      - floppy-beta-redis
    env_file:
      - floppy.env
    # These always win over floppy.env.
    environment:
      - FLOPPY_BETA_MODE=true
      - REDIS_URL=redis://floppy-beta-redis:6379
      - SENTRY_ENVIRONMENT=beta
    volumes:
      - ./data/db:/floppy/db
      - ./data/backups:/floppy/backups
    ports:
      - "0.0.0.0:${BETA_PORT:-8001}:8000"
    networks:
      - beta-net
      # Stable's network, so the Cloudflare tunnel (which lives there) can
      # reach beta as http://floppy-beta:8000.
      - tunnel-net

  # Never share stable's Redis: the Celery queues and caches would mix.
  floppy-beta-redis:
    container_name: floppy-beta-redis
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save "" --maxmemory 128mb --maxmemory-policy volatile-lru
    volumes:
      - ./data/redis:/data
    networks:
      - beta-net

networks:
  beta-net:
    driver: bridge
  tunnel-net:
    external: true
    name: ${TUNNEL_NETWORK:-floppy-floppy_floppy-net}
