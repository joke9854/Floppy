<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1c1b22" />
		<title>%sveltekit.status% · Floppy</title>
		<!-- Shown when the server cannot render a page at all (for example Django
		     not answering during the sign-in check), so no app styles: the
		     CineTrack tokens inline. -->
		<style>
			body {
				margin: 0;
				display: grid;
				place-items: center;
				min-height: 100vh;
				background: #1c1b22;
				color: #f8f9fb;
				font-family: system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			main {
				max-width: 420px;
				margin: 20px;
				padding: 28px;
				border-radius: 22px;
				text-align: center;
				background-color: rgb(180 195 210 / 7.5%);
				border: 1px solid rgb(255 255 255 / 7%);
			}
			p {
				color: #a2aeb8;
			}
			a {
				color: #a9cbff;
			}
		</style>
	</head>
	<body>
		<main>
			<p>%sveltekit.status%</p>
			<h1 style="font-size: 20px">%sveltekit.error.message%</h1>
			<p><a href="">Try again</a></p>
		</main>
	</body>
</html>
