user abc;
# Nginx is event-driven and fronts a local threaded Gunicorn worker. Matching
# host CPU count only duplicates idle workers inside this single container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep one access log at the reverse-proxy boundary. Query strings and
    # referrers can contain OAuth codes or integration tokens, so do not write
    # them to container output.
    # rt= is the whole request time in seconds, so slow endpoints show up in
    # `docker logs` without a profiler.
    log_format floppy_safe '$remote_addr [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout floppy_safe;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 512M;
    client_body_buffer_size 256k;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Templates version app assets as ?<mtime> (get_static_file_mtime), so
    # those URLs never change content and can be cached for good. Anything
    # else under /static/ (fonts and images referenced from CSS, favicons,
    # versioned-by-filename libraries) keeps the 30 day lifetime.
    map $args $floppy_static_cache_control {
        "~^[0-9]+$" "public, max-age=31536000, immutable";
        default "public, max-age=2592000";
    }

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Proxy to Gunicorn
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Static files
        location /static/ {
            alias /floppy/staticfiles/;
            add_header Cache-Control $floppy_static_cache_control;
        }

    }
}
